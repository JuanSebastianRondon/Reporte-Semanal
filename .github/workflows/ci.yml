name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm audit --audit-level=high

  windows-clients:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # windows-latest ya incluye .NET Framework 4.8 y el SDK de .NET.
      - run: npm run build:windows
