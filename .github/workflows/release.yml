name: Release

on:
  push:
    tags:
      - 'v*'
  # Red de seguridad: permite publicar manualmente desde la pestaña Actions
  # si GitHub no dispara el evento de tag (p. ej. al subir commit + tag juntos).
  # En dispatch manual se compila desde la rama elegida y se publica sobre el
  # tag indicado; en push de tag se compila desde el propio tag.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag a publicar (ej. v2.0.4)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  check-version:
    name: Validar versión del tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tag, package.json e instalador deben coincidir
        run: node scripts/check-version.js "${{ inputs.tag || github.ref_name }}"

  windows-installer:
    name: Compilar instalador de Windows
    needs: check-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Quitar source maps del paquete de release
        shell: bash
        run: find dist -name '*.map' -delete
      # Quitar devDependencies antes de empaquetar: typescript, @types y
      # ts-node suman ~26 MB y no se usan en runtime (get-windows conserva
      # sus dependencias nativas porque son dependencies, no devDependencies).
      - run: npm prune --omit=dev
      - run: npm run build:windows
      # El instalador toma los .exe de la raíz; hay que actualizarlos primero.
      - run: npm run copy:windows
      - name: Compilar instalador con Inno Setup
        shell: pwsh
        run: |
          if (Get-Command iscc -ErrorAction SilentlyContinue) {
            iscc packaging\windows\instalador.iss
          } else {
            choco install innosetup -y --no-progress
            & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\windows\instalador.iss
          }
      - name: Subir instalador como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: Output/ReporteSemanal-Setup.exe
          if-no-files-found: error
          retention-days: 5

  linux-bundle:
    name: Compilar bundle de Linux
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - run: npm ci
      - run: npm run build
      - name: Quitar source maps del paquete de release
        run: find dist -name '*.map' -delete
      - run: npm prune --omit=dev
      - name: Compilar clientes Go y empaquetar
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          ROOT="$PWD"
          mkdir -p "$ROOT/release/linux/bin" "$ROOT/release/linux/packaging"
          cp -r dist "$ROOT/release/linux/dist"
          cp package.json .env.example "$ROOT/release/linux/"
          cp -r packaging/linux "$ROOT/release/linux/packaging/linux"
          # El módulo Go vive en clients/linux (ahí está el go.mod).
          (
            cd clients/linux
            GOFLAGS='-trimpath' go build -ldflags='-s -w' -o "$ROOT/release/linux/bin/launcher" ./cmd/launcher
            GOFLAGS='-trimpath' go build -ldflags='-s -w' -o "$ROOT/release/linux/bin/monitor" ./cmd/tray
            GOFLAGS='-trimpath' go build -ldflags='-s -w' -o "$ROOT/release/linux/bin/config" ./cmd/config
          )
          tar -czf "$ROOT/release/reporte-semanal-${RELEASE_TAG}-linux.tar.gz" -C "$ROOT/release/linux" .
      - name: Subir bundle como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: linux-bundle
          path: release/*.tar.gz
          if-no-files-found: error
          retention-days: 5

  publish-release:
    name: Publicar GitHub Release
    needs: [windows-installer, linux-bundle]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Descargar artefactos
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Crear release y adjuntar archivos
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            artifacts/windows-installer/ReporteSemanal-Setup.exe
            artifacts/linux-bundle/*.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: false
